<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>구쥭이 잡기</title>
  <style>
    * { 
      box-sizing: border-box; 
      user-select: none; 
      -webkit-user-select: none; 
    }
    body {
      margin: 0; padding: 0; 
      font-family: 'Pretendard', sans-serif;
      background: #f0f4f8; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }
    #game-container {
      width: 100%; 
      max-width: 480px; 
      height: 95vh;
      height: 95dvh;
      max-height: 800px;
      min-height: 580px;
      background: #ffffff; 
      position: relative; 
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
      display: flex; 
      flex-direction: column;
      border-radius: 16px;
    }
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; background: white; z-index: 10;
    }
    .hidden { display: none !important; }
    h1 { color: #333; margin-top: 0; margin-bottom: 12px; font-size: 26px; text-align: center; }
    p { color: #666; font-size: 14px; text-align: center; margin-bottom: 20px; line-height: 1.6; }
    
    input {
      width: 85%;
      padding: 14px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      outline: none;
    }
    input:focus { border-color: #ff4757; }

    button {
      width: 85%; padding: 14px; font-size: 17px; font-weight: bold;
      color: white; background: #ff4757; border: none; border-radius: 12px;
      cursor: pointer; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
      margin-bottom: 10px;
    }
    button:active { transform: scale(0.96); }
    .btn-secondary {
      background: #70a1ff;
      box-shadow: 0 4px 10px rgba(112, 161, 255, 0.3);
    }
    #header {
      height: 56px; background: #2ed573; color: white; display: flex;
      justify-content: space-between; align-items: center; padding: 0 20px;
      font-size: 17px; font-weight: bold; z-index: 5;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }
    #header.fever-mode {
      background: linear-gradient(90deg, #ff4757, #ffa502);
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.9; }
      100% { opacity: 1; transform: scale(1.01); }
    }
    #play-area { flex: 1; position: relative; background: #f8f9fa; overflow: hidden; }
    .target {
      position: absolute; width: 68px; height: 68px;
      background-size: contain; background-repeat: no-repeat; background-position: center;
      cursor: pointer; touch-action: manipulation;
    }
    .score-popup {
      position: absolute; font-weight: bold; font-size: 24px; pointer-events: none;
      animation: floatUp 0.5s ease-out forwards; z-index: 8;
    }
    .score-popup.fever-pop {
      font-size: 30px;
      text-shadow: 0 0 5px rgba(255,255,255,0.8);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 시작 화면 -->
  <div id="start-screen" class="screen">
    <h1>💥 구쥭이 잡기 💥</h1>
    <p>
      구쥭이들을 터치해 점수를 획득하세요!<br><br>
      🖼️ 1번 구쥭이: <b>+5점</b> (느림)<br>
      🖼️ 2번 구쥭이: <b>+10점</b> (보통)<br>
      🖼️ 3번 구쥭이: <b>+20점</b> (광속)<br>
      ⚠️ 개부장: <b style="color:#ff4757;">-30점</b> (함정!)<br><br>
      🔥 <b>연속 7회 성공 시 3초간 FEVER TIME (1.5배)!</b>
    </p>
    <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요" maxlength="8">
    <button id="start-btn">게임 시작!</button>
  </div>

  <!-- 게임 헤더 및 진행 영역 -->
  <div id="header">
    <div id="header-status">점수: <span id="score-display">0</span></div>
    <div>남은시간: <span id="time-display">30</span>s</div>
  </div>
  <div id="play-area"></div>

  <!-- 결과 화면 -->
  <div id="game-over-screen" class="screen hidden">
    <h1>게임 종료!</h1>
    <p style="font-size: 18px;"><span id="player-name-display" style="font-weight:bold;"></span>님의 최종 점수:<br><b id="final-score" style="font-size: 32px; color: #ff4757;">0</b>점</p>
    
    <button id="copy-btn" class="btn-secondary">📋 점수 복사하기</button>
    <button id="restart-btn">다시 하기</button>
  </div>
</div>

<script>
  let score = 0;
  let timeLeft = 30;
  let timer = null;
  let spawnInterval = null;
  let nickname = '';

  // 피버 타임 관련 변수
  let comboCount = 0;
  let isFever = false;
  let feverTimeout = null;

  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over-screen');
  const nicknameInput = document.getElementById('nickname-input');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const copyBtn = document.getElementById('copy-btn');
  const scoreDisplay = document.getElementById('score-display');
  const timeDisplay = document.getElementById('time-display');
  const playArea = document.getElementById('play-area');
  const finalScore = document.getElementById('final-score');
  const playerNameDisplay = document.getElementById('player-name-display');
  const header = document.getElementById('header');
  const headerStatus = document.getElementById('header-status');

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
  });

  // 클립보드 복사 기능
  copyBtn.addEventListener('click', () => {
    const textToCopy = `💥 [구쥭이 잡기] ${nickname}님의 최종 점수는 ${score}점 입니다! 야 너도 해 봐! 💥`;
    
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(textToCopy).then(() => alert('점수가 클립보드에 복사되었습니다! 🎉'));
    } else {
      const textArea = document.createElement("textarea");
      textArea.value = textToCopy;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      alert('점수가 클립보드에 복사되었습니다! 🎉');
    }
  });

  function startGame() {
    nickname = nicknameInput.value.trim();
    if (!nickname) {
      alert('닉네임을 입력해주세요!');
      return;
    }

    score = 0;
    timeLeft = 30;
    comboCount = 0;
    isFever = false;
    if (feverTimeout) clearTimeout(feverTimeout);

    scoreDisplay.textContent = score;
    timeDisplay.textContent = timeLeft;
    playArea.innerHTML = '';
    header.classList.remove('fever-mode');
    headerStatus.innerHTML = `점수: <span id="score-display">${score}</span>`;

    startScreen.classList.add('hidden');

    // 30초 타이머
    timer = setInterval(() => {
      timeLeft--;
      timeDisplay.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);

    // 캐릭터 생성 (0.4초 간격)
    spawnInterval = setInterval(spawnTarget, 400);
  }

  function triggerFever() {
    isFever = true;
    comboCount = 0;
    header.classList.add('fever-mode');
    headerStatus.innerHTML = `🔥 FEVER! <span id="score-display">${score}</span>`;

    if (feverTimeout) clearTimeout(feverTimeout);

    // 3초 후 피버 종료
    feverTimeout = setTimeout(() => {
      isFever = false;
      header.classList.remove('fever-mode');
      const scoreElem = document.getElementById('score-display');
      headerStatus.innerHTML = `점수: <span id="score-display">${score}</span>`;
    }, 3000);
  }

  function spawnTarget() {
    const target = document.createElement('div');
    target.classList.add('target');

    const areaWidth = playArea.clientWidth - 68;
    const areaHeight = playArea.clientHeight - 68;

    target.style.left = `${Math.random() * areaWidth}px`;
    target.style.top = `${Math.random() * areaHeight}px`;

    const rand = Math.random();
    let imageSrc, speed, basePoints, color;

    if (rand < 0.25) { 
      // 1번: 5점 (느림 1.2초)
      imageSrc = 'rabbit1.png';
      speed = 1.2;
      basePoints = 5;
      color = '#2ed573';
    } else if (rand < 0.55) { 
      // 2번: 10점 (보통 0.8초)
      imageSrc = 'rabbit2.png';
      speed = 0.8;
      basePoints = 10;
      color = '#ffa502';
    } else if (rand < 0.80) { 
      // 3번: 20점 (광속 0.45초)
      imageSrc = 'rabbit3.png';
      speed = 0.45;
      basePoints = 20;
      color = '#ff4757';
    } else { 
      // 4번: -30점 (함정!)
      imageSrc = 'rabbit4.png';
      speed = [0.45, 0.8, 1.2][Math.floor(Math.random() * 3)];
      basePoints = -30;
      color = '#2f3542';
    }

    target.style.backgroundImage = `url('${imageSrc}')`;
    playArea.appendChild(target);

    const removeTimeout = setTimeout(() => {
      if (target.parentNode) target.remove();
    }, speed * 1000);

    target.addEventListener('pointerdown', (e) => {
      e.preventDefault();

      let finalGainedPoints = basePoints;

      if (basePoints > 0) {
        // 성공했을 때
        if (isFever) {
          finalGainedPoints = basePoints * 1.5; // 피버 타임 1.5배 (7.5, 15, 30)
        } else {
          comboCount++;
          if (comboCount >= 7) {
            triggerFever();
          }
        }
      } else {
        // 함정(-30점)을 누른 경우: 콤보 초기화 및 -30점 고정 (피버 중이어도 1.5배 안 됨)
        comboCount = 0;
      }

      score += finalGainedPoints;
      const scoreElem = document.getElementById('score-display');
      if (scoreElem) scoreElem.textContent = score;

      const popupText = finalGainedPoints > 0 ? `+${finalGainedPoints}` : `${finalGainedPoints}`;
      showPopup(e.clientX, e.clientY, popupText, color, isFever && basePoints > 0);

      clearTimeout(removeTimeout);
      target.remove();
    });
  }

  function showPopup(x, y, text, color, isFeverPop) {
    const rect = playArea.getBoundingClientRect();
    const popup = document.createElement('div');
    popup.classList.add('score-popup');
    if (isFeverPop) popup.classList.add('fever-pop');
    
    popup.textContent = text;
    popup.style.color = color;
    popup.style.left = `${x - rect.left}px`;
    popup.style.top = `${y - rect.top}px`;

    playArea.appendChild(popup);
    setTimeout(() => popup.remove(), 500);
  }

  function endGame() {
    clearInterval(timer);
    clearInterval(spawnInterval);
    if (feverTimeout) clearTimeout(feverTimeout);
    
    playArea.innerHTML = '';
    header.classList.remove('fever-mode');

    finalScore.textContent = score;
    playerNameDisplay.textContent = nickname;
    gameOverScreen.classList.remove('hidden');
  }
</script>
</body>
</html>
